# =============================================================================
# Control · Pipeline de integración continua
# -----------------------------------------------------------------------------
# Objetivo central: que una falla de aislamiento multi-tenant no pueda llegar a
# `main`. El job `isolation` es el más importante del pipeline — es el que
# materializa el criterio F0-AC2 del plan de producción: un PR que agrega una
# tabla sin política RLS debe fallar.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PG_VERSION: '16'

jobs:
  # ---------------------------------------------------------------------------
  # 1 · Migraciones: se aplican desde cero sobre una base limpia. Si una
  #     migración no es reproducible, todo lo demás es irrelevante.
  # ---------------------------------------------------------------------------
  migrations:
    name: Migraciones desde cero
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/control_test
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar migraciones en orden
        run: |
          set -euo pipefail
          for f in $(ls db/migrations/*.sql | sort); do
            echo "▶ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Aplicar catálogo del sistema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/seed/0001_system_catalog.sql

      - name: Verificar que la aserción de cobertura pasa
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT app.assert_rls_coverage();"

      - name: Verificar el ledger de jobs
        run: |
          set -euo pipefail
          JOBS=$(psql "$DATABASE_URL" -t -A -c "SELECT count(*) FROM ops.jobs WHERE is_active;")
          echo "jobs activos: $JOBS"
          if [ "$JOBS" -lt 4 ]; then
            echo "::error::El catálogo de jobs quedó vacío o incompleto"
            exit 1
          fi
          psql "$DATABASE_URL" -t -A -c "SELECT code, is_overdue FROM ops.v_job_health;"

  # ---------------------------------------------------------------------------
  # 2 · Lint de cobertura RLS. Rápido, sin datos: detecta la tabla nueva sin
  #     política antes de que llegue a revisión humana.
  #
  #     El lint consulta el catálogo (`pg_class`, `pg_policy`), que es visible
  #     para cualquier rol. Migrar requiere superusuario —hay `CREATE ROLE` en
  #     0007—, así que la preparación va con el DSN administrativo; el lint en sí
  #     corre con el rol de aplicación para que el privilegio que ejercita sea el
  #     mismo que el de la suite.
  # ---------------------------------------------------------------------------
  rls-lint:
    name: Lint de cobertura RLS
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/control_test
      DATABASE_URL: postgres://app_login:AppL0gin!@localhost:5432/control_test
    steps:
      - uses: actions/checkout@v4

      - name: Preparar esquema
        run: |
          set -euo pipefail
          for f in $(ls db/migrations/*.sql | sort); do
            psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/seed/0001_system_catalog.sql

      - name: Crear el rol de aplicación
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE app_login LOGIN PASSWORD 'AppL0gin!' NOBYPASSRLS IN ROLE control_app;"

      - name: Ejecutar lint (falla si hay filas)
        run: |
          set -euo pipefail
          OUT=$(psql "$DATABASE_URL" -t -A -f tests/isolation/lint_rls_coverage.sql \
                | grep -v '^$' | grep -v '^Recordatorio' || true)
          if [ -n "$OUT" ]; then
            echo "::error::Defectos de cobertura RLS detectados"
            echo "$OUT"
            exit 1
          fi
          echo "Cobertura RLS completa."

      # Los validadores estructurales no necesitan motor: son análisis de texto.
      # Van acá porque este job es el más rápido del pipeline y porque su
      # propósito es el mismo — detectar en un PR lo que un ojo humano no ve.
      #
      # `check-suite-sql` DESCUBRE las suites en vez de recibir una ruta fija.
      # Antes apuntaba a `tests/isolation/run.mjs` y siguió reportando verde
      # mientras las suites contable y de compras acumulaban cientos de bloques
      # SQL sin revisar. Un validador con una lista escrita a mano deja de
      # proteger en silencio.
      - name: Validar el SQL embebido en las suites
        run: node tools/check-suite-sql.mjs

      - name: Validar el orden de las migraciones
        run: node tools/check-migration-order.mjs

      - name: Validar las claves foráneas compuestas
        run: node tools/check-composite-fks.mjs

      - name: Validar las tablas particionadas
        run: node tools/check-partitioned-tables.mjs

      - name: Validar la estructura del workflow
        run: node tools/validate-workflow.mjs

  # ---------------------------------------------------------------------------
  # 3 · Suite de aislamiento con datos reales de dos inquilinos. Es la prueba
  #     que de verdad importa: verifica lectura, escritura y fail-closed.
  #
  #     POR QUÉ DOS ROLES
  #
  #     El superusuario de PostgreSQL IGNORA RLS siempre, incluso con FORCE ROW
  #     LEVEL SECURITY. Si la suite corriera con `postgres`, cada aserción de
  #     fuga pasaría por el motivo equivocado: el rol ve todo, incluidas las
  #     filas ajenas, así que "0 filas de B visibles desde A" daría falso tanto
  #     con las políticas bien como con las políticas rotas. Este job usaba
  #     antes el DSN de superusuario: el aislamiento nunca se probó.
  #
  #     `app_login` es miembro de `control_app` y no tiene BYPASSRLS, así que
  #     ejercita las políticas reales que ve la aplicación.
  # ---------------------------------------------------------------------------
  isolation:
    name: Aislamiento multi-tenant
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Administrativo: sólo para migrar y preparar el escenario.
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/control_test
      # De aplicación: conduce las pruebas. Debe ser miembro de control_app.
      DATABASE_URL: postgres://app_login:AppL0gin!@localhost:5432/control_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar esquema
        run: |
          set -euo pipefail
          for f in $(ls db/migrations/*.sql | sort); do
            psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/seed/0001_system_catalog.sql

      - name: Crear el rol de aplicación
        run: |
          set -euo pipefail
          # Sin LOGIN no se puede conectar; sin NOINHERIT hereda los privilegios
          # de control_app al conectar (NOINHERIT por defecto es INHERIT, que es
          # lo que queremos). NOBYPASSRLS es la propiedad que hace que la suite
          # mida algo. `control_app` lo crea la migración 0007.
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE app_login LOGIN PASSWORD 'AppL0gin!' NOBYPASSRLS IN ROLE control_app;"

      - name: Verificar que el rol de aplicación no sea privilegiado
        run: |
          set -euo pipefail
          PRIV=$(psql "$ADMIN_DATABASE_URL" -t -A -c \
            "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = 'app_login';")
          if [ "$PRIV" != "f" ]; then
            echo "::error::app_login es superusuario o tiene BYPASSRLS: la suite no probaría RLS"
            exit 1
          fi
          echo "app_login: sin privilegios de bypass."

      - name: Prueba negativa · la suite DEBE abortar con el DSN de superusuario
        run: |
          set -euo pipefail
          set +e
          node tests/isolation/run.mjs --dsn "$ADMIN_DATABASE_URL" --verbose
          RC=$?
          set -e
          if [ "$RC" -ne 2 ]; then
            echo "::error::La suite no abortó con el DSN de superusuario (exit $RC)."
            echo "::error::La guardia de rol está rota: el aislamiento no se estaría probando."
            exit 1
          fi
          echo "Guardia de rol confirmada: aborta (exit 2) con rol privilegiado."

      - name: Ejecutar suite de aislamiento (rol de aplicación)
        run: node tests/isolation/run.mjs --verbose

  # ---------------------------------------------------------------------------
  # 3bis · Invariantes del núcleo contable (puerta de salida de E1).
  #
  #        La migración 0012 declara garantías en el ADR 0001: partida doble
  #        aplicada por el motor, período cerrado inmutable, saldos que no
  #        mienten, aislamiento contable. Este job verifica que el motor las
  #        aplique de verdad, escribiendo por INSERT directo —saltando
  #        post_entry()— porque la pregunta que importa no es "¿la función
  #        valida?" sino "¿un camino que se saltee la función puede escribir
  #        un dato inválido?".
  #
  #        Corre con el mismo rol de aplicación que el job de aislamiento: la
  #        suite aborta con exit 2 si detecta un rol privilegiado, porque el
  #        superusuario ignora RLS y podría escribir la plantilla contable
  #        salteando la política restrictiva.
  #
  #        No necesita preparar el escenario a mano: crea y destruye sus
  #        propias empresas. Eso la hace independiente del seed.
  # ---------------------------------------------------------------------------
  accounting:
    name: Invariantes contables
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/control_test
      DATABASE_URL: postgres://app_login:AppL0gin!@localhost:5432/control_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar esquema
        run: |
          set -euo pipefail
          for f in $(ls db/migrations/*.sql | sort); do
            psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/seed/0001_system_catalog.sql

      - name: Crear el rol de aplicación
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE app_login LOGIN PASSWORD 'AppL0gin!' NOBYPASSRLS IN ROLE control_app;"

      - name: Ejecutar invariantes contables
        run: |
          node tests/accounting/run.mjs \
            --dsn "$DATABASE_URL" \
            --admin-dsn "$ADMIN_DATABASE_URL" \
            --verbose

  # ---------------------------------------------------------------------------
  # 3 bis · Compras y cuentas por pagar (puerta E3 del plan ERP).
  #
  #     Mide la puerta, no la declara. La recepción parcial integrada con stock y
  #     costo se verifica de punta a punta: 100 pedidas, 60 recibidas → la línea
  #     queda `partial`; las 40 restantes cierran la orden y el costo promedio
  #     ponderado queda exactamente en 1540 = (60×1500 + 40×1600)/100.
  #
  #     Necesita los DOS DSN. La preparación y la limpieza del escenario corren
  #     como rol de plataforma porque `app.stock_movements` es append-only y
  #     `control_app` no tiene DELETE: sin el DSN administrativo la suite sale con
  #     código 2 en vez de disfrazarse de error de permisos.
  # ---------------------------------------------------------------------------
  purchasing:
    name: Invariantes de compras
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/control_test
      DATABASE_URL: postgres://app_login:AppL0gin!@localhost:5432/control_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar esquema
        run: |
          set -euo pipefail
          for f in $(ls db/migrations/*.sql | sort); do
            psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/seed/0001_system_catalog.sql

      - name: Crear el rol de aplicación
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE app_login LOGIN PASSWORD 'AppL0gin!' NOBYPASSRLS IN ROLE control_app;"

      - name: Ejecutar invariantes de compras
        run: |
          node tests/purchasing/run.mjs \
            --dsn "$DATABASE_URL" \
            --admin-dsn "$ADMIN_DATABASE_URL" \
            --verbose

  # ---------------------------------------------------------------------------
  # 3 ter · Cobros y tesorería (puerta E4 del plan ERP).
  #
  #     Mide la puerta, no la declara: §7.1 la define como "el saldo de tesorería
  #     cuadra con los movimientos" y §6.2 la desglosa en T-1..T-7. La suite recorre
  #     la cadena completa —el cliente debe, cobra, el dinero entra a una cuenta y
  #     el saldo de esa cuenta refleja el cobro— porque una suite que probara cada
  #     migración por separado podría estar verde con la cadena rota en el medio.
  #
  #     Encontró dos defectos reales antes de llegar a verde, y los dos valen para
  #     entender por qué el job existe:
  #
  #       · 0015 bloqueaba el cobro de toda factura autorizada. La política
  #         RESTRICTIVE de 0006 (`status <> 'authorized'` para UPDATE) alcanzaba
  #         también al FOR UPDATE y al UPDATE de los acumuladores de cobro. El
  #         síntoma era "La factura <uuid> no existe en esta empresa" señalando una
  #         factura que estaba a la vista, y un UPDATE que afectaba 0 filas sin
  #         error: la cobranza se registraba y el saldo del cliente no bajaba.
  #         Corregido en 0015 con una política acotada y un trigger que compara la
  #         fila vieja con la nueva.
  #
  #       · El saldo de apertura de una cuenta declarado en `opening_balance` no
  #         estaba atado a su movimiento, así que el gate de E4 podía dar verde con
  #         el saldo declarado divergiendo del derivado.
  #
  #     Necesita los DOS DSN por la misma razón que compras: la limpieza del
  #     escenario toca `treasury.movements`, que es inmutable para el rol de
  #     aplicación (el UPDATE está revocado Y hay un trigger que lo rechaza).
  # ---------------------------------------------------------------------------
  treasury:
    name: Invariantes de cobros y tesorería
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/control_test
      DATABASE_URL: postgres://app_login:AppL0gin!@localhost:5432/control_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar esquema
        run: |
          set -euo pipefail
          for f in $(ls db/migrations/*.sql | sort); do
            psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/seed/0001_system_catalog.sql

      - name: Crear el rol de aplicación
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE app_login LOGIN PASSWORD 'AppL0gin!' NOBYPASSRLS IN ROLE control_app;"

      - name: Ejecutar invariantes de cobros y tesorería
        run: |
          node tests/treasury/run.mjs \
            --dsn "$DATABASE_URL" \
            --admin-dsn "$ADMIN_DATABASE_URL" \
            --verbose

  # ---------------------------------------------------------------------------
  # 3 quater · Fundación fiscal (fase E5, primera parte).
  #
  #     NO es el gate de E5. §7.1 lo define como "posición de IVA reproducible
  #     desde el libro", y esta suite no calcula IVA: verifica las dos cosas que
  #     tienen que estar antes de que ese cálculo exista, y que el cálculo no
  #     puede arreglar después.
  #
  #     La primera es un renombre. `0004` declaraba la columna `cae` con un CHECK
  #     de formato argentino (`^[0-9]{14}$`), mientras el dominio TypeScript ya era
  #     neutral (`authorizationId`). Ese CHECK convierte "agregar un país" en
  #     "migrar la tabla de comprobantes": un comprobante chileno o mexicano no
  #     puede representarse ni renombrando la columna. `0017` ejecuta la decisión
  #     del ADR 0003 y esta suite comprueba que el renombre no rompió la
  #     inmutabilidad fiscal, que es un trigger de plpgsql sobre la columna vieja.
  #
  #     La segunda es dónde viven las alícuotas. El ADR 0004 decide que son
  #     parámetros con vigencia temporal y no constantes: una alícuota es una norma
  #     con fecha, y si es una constante un comprobante de marzo se recalcula con
  #     la de septiembre.
  #
  #     Esta suite encontró SIETE defectos que la validación estructural no podía
  #     ver, y por eso existe. Los tres que más valen:
  #
  #       · `COMMENT ON COLUMN local_codes` corría antes del `ALTER TABLE ... ADD
  #         COLUMN local_codes`. Falla la migración entera con "no existe la columna
  #         local_codes", apuntando al COMMENT y no al ADD que falta.
  #
  #       · La constraint de exclusión de vigencia NO protegía las alícuotas de
  #         plataforma. En un `EXCLUDE`, NULL se considera distinto de NULL —al
  #         revés que en un `UNIQUE`—, así que dos alícuotas de IVA al 21% con
  #         `tenant_id IS NULL` y rangos solapados entraban las dos, y `rates_on()`
  #         devolvía DOS filas para la misma fecha. Es exactamente la
  #         irreproducibilidad que F-6 prohíbe, en el caso que existe desde el día
  #         uno. Se corrigió con un centinela en `COALESCE`, igual que `0012` para
  #         el plan mínimo de cuentas.
  #
  #       · Dos FK simples a `fiscal.taxes(id)` sobre una tabla con `tenant_id`.
  #         No fallan, funcionan, y permiten que una fila de la empresa A apunte a
  #         un parámetro de la empresa B. Lo detectó `check-composite-fks`.
  #
  #     Corre contra un motor real porque ninguno de los tres se ve leyendo el
  #     archivo: los tres aparecieron al aplicar la migración y ejecutar consultas.
  #
  #     A partir de E5 este job TAMBIÉN ejecuta `tests/fiscal/run.mjs`, que es el
  #     gate MEDIDO de la fase: §7.1 lo define como "posición de IVA reproducible
  #     desde el libro", y lo mide contra un motor real con constantes calculadas a
  #     mano (F-1..F-6). La fundación de 0017 y el gate conviven en el mismo job
  #     porque los dos necesitan el mismo motor y el mismo rol de aplicación; juntos
  #     cierran la fase —sin el gate medido, la fundación por sí sola no prueba que
  #     el libro fiscal cuadra con los comprobantes, que era exactamente el falso
  #     verde de 0018—. Por eso `run.mjs` es el que cuenta para dar E5 por cerrada.
  # ---------------------------------------------------------------------------
  fiscal:
    name: Fundación y puerta fiscal (E5)
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/control_test
      DATABASE_URL: postgres://app_login:AppL0gin!@localhost:5432/control_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Preparar esquema
        run: |
          set -euo pipefail
          for f in $(ls db/migrations/*.sql | sort); do
            psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/seed/0001_system_catalog.sql

      - name: Crear el rol de aplicación
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE app_login LOGIN PASSWORD 'AppL0gin!' NOBYPASSRLS IN ROLE control_app;"

      - name: Verificar la fundación fiscal
        run: |
          node tests/fiscal/_verify_0017.mjs --dsn "$ADMIN_DATABASE_URL"

      - name: Ejecutar la puerta de E5 (posición de IVA reproducible desde el libro)
        run: |
          node tests/fiscal/run.mjs \
            --dsn "$DATABASE_URL" \
            --admin-dsn "$ADMIN_DATABASE_URL" \
            --verbose

  # ---------------------------------------------------------------------------
  # 4 · TypeScript de la API.
  #
  #     Existía un job "probe" que salteaba todo si no encontraba `package.json`
  #     en la raíz. No había ninguno, así que el job nunca corrió: el pipeline
  #     mostraba verde sin haber compilado una sola línea. Al crear el manifiesto
  #     real aparecieron ~20 errores de tipo que llevaban ahí desde el principio
  #     —incluidas dos llamadas a métodos inexistentes y una cadencia de cron que
  #     ignoraba el día de la semana—. Un chequeo que puede pasar por no hacer
  #     nada no es una barrera. Ahora el job falla si no hay `package.json`,
  #     porque la ausencia es el defecto, no el caso a tolerar.
  # ---------------------------------------------------------------------------
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exigir manifiesto
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "::error::Falta package.json en la raíz. Sin él, el typecheck no puede correr."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: tsc --noEmit (raíz)
        run: npx tsc --noEmit

      - name: tsc --noEmit (API)
        run: npm run typecheck --workspace @control/api

  # ---------------------------------------------------------------------------
  # 5 · Tests unitarios. No existía ninguno. Cubren la lógica que no necesita
  #     base de datos: hoy, la evaluación de cadencias del scheduler —que es
  #     donde se encontró un defecto real: `*/15 * * * MON` devolvía 15 minutos,
  #     ignorando el día de la semana, y habría corrido el job 96 veces por día
  #     en vez de 24 veces por semana.
  # ---------------------------------------------------------------------------
  unit:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

      - name: Verificar que hay tests (no un verde vacío)
        run: |
          set -euo pipefail
          OUT=$(npm test 2>&1)
          echo "$OUT" | tail -20
          PASS=$(echo "$OUT" | sed -n 's/^# pass \([0-9]*\)$/\1/p' | tail -1)
          if [ -z "$PASS" ] || [ "$PASS" -lt 1 ]; then
            echo "::error::No se ejecutó ningún test. Un job verde sin tests es peor que uno ausente."
            exit 1
          fi
          echo "tests ejecutados: $PASS"

  # ---------------------------------------------------------------------------
  # 6 · Guardia de secretos: certificados AFIP y claves nunca deben entrar al
  #     repositorio. Un `.pem` commiteado es un incidente de seguridad.
  # ---------------------------------------------------------------------------
  secret-guard:
    name: Guardia de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar credenciales en el árbol
        run: |
          set -euo pipefail
          FOUND=$(git ls-files | grep -E '\.(pem|key|crt|p12|pfx)$' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Certificados o claves versionados:"
            echo "$FOUND"
            exit 1
          fi
          echo "Sin credenciales versionadas."

      - name: Buscar .env versionados
        run: |
          set -euo pipefail
          FOUND=$(git ls-files | grep -E '(^|/)\.env' | grep -v '\.env\.example' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Archivos .env versionados:"
            echo "$FOUND"
            exit 1
          fi
          echo "Sin .env versionados."
